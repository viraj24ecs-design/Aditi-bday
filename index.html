<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Aditi 🎂</title>
  <meta name="description" content="A special birthday surprise for Aditi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Inter', sans-serif;
    }

    /* ── Shared particles ── */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.6);
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ── Timer Screen (days/hours/mins/secs) ── */
    #timer-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: radial-gradient(ellipse at 50% 40%, #1a0a2e 0%, #0a0a0a 70%);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #timer-screen.fade-out {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    .timer-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      background: linear-gradient(135deg, #f5e6ff 0%, #d4a5ff 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-align: center;
      padding: 0 1rem;
    }

    .timer-subtitle {
      font-weight: 300;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .timer-grid {
      display: flex;
      gap: clamp(0.8rem, 3vw, 2rem);
      align-items: center;
    }

    .timer-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: clamp(3.5rem, 12vw, 6rem);
    }

    .timer-value {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      line-height: 1;
      background: linear-gradient(135deg, #f5e6ff 0%, #d4a5ff 30%, #a855f7 60%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.3));
    }

    .timer-label {
      font-weight: 300;
      font-size: clamp(0.55rem, 1.2vw, 0.75rem);
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .timer-separator {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 5vw, 3rem);
      color: rgba(168, 85, 247, 0.4);
      margin-bottom: 1.2rem;
      animation: separatorPulse 1s ease-in-out infinite;
    }

    @keyframes separatorPulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* ── Countdown Screen (10-sec) ── */
    #countdown-screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: radial-gradient(ellipse at 50% 40%, #1a0a2e 0%, #0a0a0a 70%);
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer;
    }

    #countdown-screen.visible {
      display: flex;
    }

    #countdown-screen.fade-out {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    #countdown-screen.running {
      cursor: default;
    }

    #countdown-screen.running .tap-prompt {
      display: none;
    }

    .countdown-label {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .countdown-number {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(6rem, 20vw, 14rem);
      line-height: 1;
      background: linear-gradient(135deg, #f5e6ff 0%, #d4a5ff 30%, #a855f7 60%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(168, 85, 247, 0.4));
      transition: transform 0.15s ease;
      user-select: none;
    }

    .countdown-number.pulse {
      animation: countPulse 0.6s ease-out;
    }

    @keyframes countPulse {
      0% {
        transform: scale(1.15);
        opacity: 0.7;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .tap-prompt {
      position: absolute;
      bottom: 6rem;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 300;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      animation: tapFade 2s ease-in-out infinite;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes tapFade {

      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.8;
      }
    }

    /* Progress ring */
    .progress-ring {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
    }

    .progress-ring circle {
      fill: none;
      stroke-width: 2;
    }

    .progress-ring .ring-bg {
      stroke: rgba(255, 255, 255, 0.08);
    }

    .progress-ring .ring-fill {
      stroke: url(#ring-gradient);
      stroke-linecap: round;
      stroke-dasharray: 251.3;
      stroke-dashoffset: 251.3;
      transition: stroke-dashoffset 1s linear;
      transform: rotate(-90deg);
      transform-origin: center;
    }

    /* ── Video Screen ── */
    #video-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #video-screen.visible {
      opacity: 1;
    }

    #birthday-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

  <!-- ========================================= -->
  <!-- TIMER: days / hours / minutes / seconds   -->
  <!-- ========================================= -->
  <div id="timer-screen">
    <div class="particles" id="particles-timer"></div>
    <h1 class="timer-title">Something Special is Coming ✨</h1>
    <p class="timer-subtitle">countdown begins in</p>
    <div class="timer-grid">
      <div class="timer-unit">
        <span class="timer-value" id="t-days">00</span>
        <span class="timer-label">Days</span>
      </div>
      <span class="timer-separator">:</span>
      <div class="timer-unit">
        <span class="timer-value" id="t-hours">00</span>
        <span class="timer-label">Hours</span>
      </div>
      <span class="timer-separator">:</span>
      <div class="timer-unit">
        <span class="timer-value" id="t-mins">00</span>
        <span class="timer-label">Minutes</span>
      </div>
      <span class="timer-separator">:</span>
      <div class="timer-unit">
        <span class="timer-value" id="t-secs">00</span>
        <span class="timer-label">Seconds</span>
      </div>
    </div>
  </div>

  <!-- ========================================= -->
  <!-- 10-SECOND COUNTDOWN                      -->
  <!-- ========================================= -->
  <div id="countdown-screen">
    <div class="particles" id="particles-countdown"></div>
    <p class="countdown-label">get ready</p>
    <div class="countdown-number" id="count">10</div>
    <p class="tap-prompt">tap anywhere to start</p>

    <svg class="progress-ring" width="84" height="84" viewBox="0 0 84 84">
      <defs>
        <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d4a5ff" />
          <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="42" cy="42" r="40" />
      <circle class="ring-fill" cx="42" cy="42" r="40" id="ring-fill" />
    </svg>
  </div>

  <!-- ========================================= -->
  <!-- VIDEO                                     -->
  <!-- ========================================= -->
  <div id="video-screen">
    <video id="birthday-video" playsinline webkit-playsinline muted preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    // ╔══════════════════════════════════════════════════════╗
    // ║  🎯 TARGET DATE — EDIT THIS LINE TO CHANGE DATE    ║
    // ║  Format: new Date('YYYY-MM-DDTHH:MM:SS')           ║
    // ║  The time is in the visitor's LOCAL timezone.       ║
    // ╚══════════════════════════════════════════════════════╝
    const TARGET_DATE = new Date('2026-05-08T03:15:00');

    // ── Generate particles for both screens ──
    function spawnParticles(containerId) {
      const el = document.getElementById(containerId);
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (4 + Math.random() * 6) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
        p.style.background = `hsla(${260 + Math.random() * 40}, 70%, ${60 + Math.random() * 30}%, ${0.3 + Math.random() * 0.5})`;
        el.appendChild(p);
      }
    }
    spawnParticles('particles-timer');
    spawnParticles('particles-countdown');

    // ── Timer logic (days / hours / mins / secs) ──
    const tDays = document.getElementById('t-days');
    const tHours = document.getElementById('t-hours');
    const tMins = document.getElementById('t-mins');
    const tSecs = document.getElementById('t-secs');
    let timerInterval;

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateTimer() {
      const now = new Date();
      const diff = TARGET_DATE - now;

      if (diff <= 0) {
        // Timer done — transition to countdown screen
        clearInterval(timerInterval);
        tDays.textContent = '00';
        tHours.textContent = '00';
        tMins.textContent = '00';
        tSecs.textContent = '00';
        transitionToCountdown();
        return;
      }

      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      tDays.textContent = pad(d);
      tHours.textContent = pad(h);
      tMins.textContent = pad(m);
      tSecs.textContent = pad(s);
    }

    updateTimer(); // run immediately
    timerInterval = setInterval(updateTimer, 1000);

    // ── Transition: timer → countdown ──
    function transitionToCountdown() {
      const timerScreen = document.getElementById('timer-screen');
      const countdownScreen = document.getElementById('countdown-screen');

      timerScreen.classList.add('fade-out');

      setTimeout(() => {
        timerScreen.style.display = 'none';
        countdownScreen.classList.add('visible');
        setupCountdownTap();
      }, 800);
    }

    // ── 10-second countdown logic ──
    const TOTAL = 10;
    const countEl = document.getElementById('count');
    const ringFill = document.getElementById('ring-fill');
    const circumference = 2 * Math.PI * 40; // ~251.3
    let remaining = TOTAL;

    function tick() {
      countEl.textContent = remaining;

      // pulse animation
      countEl.classList.remove('pulse');
      void countEl.offsetWidth; // force reflow
      countEl.classList.add('pulse');

      // progress ring
      const progress = (TOTAL - remaining) / TOTAL;
      ringFill.style.strokeDashoffset = circumference * (1 - progress);

      if (remaining <= 0) {
        showVideo();
        return;
      }

      remaining--;
      setTimeout(tick, 1000);
    }

    function showVideo() {
      const cs = document.getElementById('countdown-screen');
      const vs = document.getElementById('video-screen');
      const video = document.getElementById('birthday-video');

      cs.classList.add('fade-out');

      setTimeout(() => {
        cs.style.display = 'none';
        vs.classList.add('visible');
        // Unmute and play
        video.muted = false;
        video.play().catch(() => {
          // If unmuted play fails, play muted as fallback
          video.muted = true;
          video.play();
        });
      }, 800);
    }

    // ── Tap to start (only enabled after timer finishes) ──
    function setupCountdownTap() {
      const cs = document.getElementById('countdown-screen');
      const video = document.getElementById('birthday-video');

      cs.addEventListener('click', function startHandler() {
        cs.removeEventListener('click', startHandler);
        cs.classList.add('running');

        // Prime the video on user gesture so mobile browsers allow playback
        video.load();
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(() => { });

        setTimeout(tick, 400);
      }, { once: true });
    }
  </script>

</body>

</html>
